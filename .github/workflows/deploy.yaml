name: Build, Push to Docker Hub & Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build & Push Images to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: |
            codernex/portfolio:api
            codernex/portfolio:api-latest
            codernex/portfolio:api-${{ github.sha }}

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_S3_BASE_URL=${{ secrets.NEXT_PUBLIC_S3_BASE_URL }}
          tags: |
            codernex/portfolio:web
            codernex/portfolio:web-latest
            codernex/portfolio:web-${{ github.sha }}

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    env:
      DB_URL: ${{ secrets.DB_URL }}
      PORT: ${{ secrets.PORT }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_EXPIRY: ${{ secrets.JWT_EXPIRY }}
      REFRESH_EXPIRY: ${{ secrets.REFRESH_EXPIRY }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_S3_BUCKET_NAME: ${{ secrets.AWS_S3_BUCKET_NAME }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AUTH_COOKIE_SECRET: ${{ secrets.AUTH_COOKIE_SECRET }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_S3_BASE_URL: ${{ secrets.NEXT_PUBLIC_S3_BASE_URL }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_KEY: ${{ secrets.EC2_KEY }}
      MAILTRAP_TOKEN: ${{secrets.MAILTRAP_TOKEN}}

    steps:
      - name: SSH to EC2, pull images and start containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ env.EC2_KEY }}
          port: 22
          envs: DB_URL,PORT,JWT_SECRET,JWT_EXPIRY,REFRESH_EXPIRY,BREVO_API_KEY,AWS_REGION,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_S3_BUCKET_NAME,R2_ACCOUNT_ID,R2_ENDPOINT,R2_ACCESS_KEY_ID,R2_SECRET_ACCESS_KEY,R2_BUCKET_NAME,R2_PUBLIC_URL,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,GEMINI_API_KEY,AUTH_COOKIE_SECRET,AUTH_SECRET,NEXT_PUBLIC_API_URL,NEXT_PUBLIC_S3_BASE_URL,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            set -e

            mkdir -p ~/apps/portfolio
            cd ~/apps/portfolio

            if [ ! -d .git ]; then
              git init
              git remote add origin https://github.com/codernex/portfolio.git
            else
              git remote add origin https://github.com/codernex/portfolio.git 2>/dev/null || git remote set-url origin https://github.com/codernex/portfolio.git
            fi

            git fetch origin main
            git reset --hard origin/main

            # Create production .env file
            cat > .env <<EOF
            NODE_ENV=production
            DB_URL=$DB_URL
            PORT=$PORT
            JWT_SECRET=$JWT_SECRET
            JWT_EXPIRY=$JWT_EXPIRY
            REFRESH_EXPIRY=$REFRESH_EXPIRY
            BREVO_API_KEY=$BREVO_API_KEY
            AWS_REGION=$AWS_REGION
            AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
            AWS_S3_BUCKET_NAME=$AWS_S3_BUCKET_NAME
            R2_ACCOUNT_ID=$R2_ACCOUNT_ID
            R2_ENDPOINT=$R2_ENDPOINT
            R2_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID
            R2_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY
            R2_BUCKET_NAME=$R2_BUCKET_NAME
            R2_PUBLIC_URL=$R2_PUBLIC_URL
            GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID
            GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET
            GEMINI_API_KEY=$GEMINI_API_KEY
            AUTH_COOKIE_SECRET=$AUTH_COOKIE_SECRET
            AUTH_SECRET=$AUTH_SECRET
            NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL
            NEXT_PUBLIC_S3_BASE_URL=$NEXT_PUBLIC_S3_BASE_URL
            MAILTRAP_TOKEN=$MAILTRAP_TOKEN
            MAILTRAP_SENDER_EMAIL=contact@codernex.dev
            MAILTRAP_SENDER_NAME=Borhan Uddin (Codernex)
            EOF

            # Log in to Docker Hub on EC2
            echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

            # Pull latest images from Docker Hub
            docker compose pull

            # Zero-Downtime Deployment: Wait for container healthchecks before completing
            docker compose up -d --wait --remove-orphans
