services:
  api:
    image: codernex/portfolio:api
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: portfolio-api
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5000
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5000/api/v1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  web:
    image: codernex/portfolio:web
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_S3_BASE_URL: ${NEXT_PUBLIC_S3_BASE_URL}
    container_name: portfolio-web
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
